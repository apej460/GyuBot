services:
  mariadb:
    image: mariadb:11
    container_name: gyubot-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: gyubot_auth
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gyubot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: gyubot-mailpit
    ports:
      - "1025:1025" # SMTP - auth-service가 여기로 OTP 메일 발송
      - "8025:8025" # 웹 UI - http://localhost:8025 에서 수신 메일 확인

volumes:
  mariadb-data:
