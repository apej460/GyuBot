services:
  mariadb:
    image: mariadb:11
    container_name: gyubot-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gyubot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: gyubot-mailpit
    ports:
      - "1025:1025" # SMTP - auth-service가 여기로 OTP 메일 발송
      - "8025:8025" # 웹 UI - http://localhost:8025 에서 수신 메일 확인

  kafka:
    image: apache/kafka:latest
    container_name: gyubot-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft 단일 노드 모드 (Zookeeper 없이) - document-service가 document.uploaded 이벤트를 발행하고
      # search-service가 비동기로 구독해 Chunking/색인을 수행하는 구조의 기반.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  minio:
    # 버전을 고정해 :latest의 예기치 않은 변경을 피한다.
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: gyubot-minio
    ports:
      # 9000~9004는 로컬 환경의 Jupyter 커널이 통째로 점유하고 있어(ZMQ 채널 5개) 9100번대로 옮겼다.
      # 이 충돌 때문에 AWS SDK 요청이 응답 없이 계속 멈추는 원인을 한참 찾아 헤맸다 — curl은
      # 우연히 그럴듯한 응답을 받아 정상처럼 보였음 (lsof -i -P -n -a -p <pid>로 충돌 확인).
      - "9100:9000" # S3 호환 API - document-service가 원본 파일을 여기 저장
      - "9101:9001" # 웹 콘솔 - http://localhost:9101 (minioadmin/minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
  minio-data:
