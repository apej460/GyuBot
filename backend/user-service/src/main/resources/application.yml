spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/gyubot_user}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# auth-service가 발급한 JWT를 검증만 하기 위한 값 (토큰 발급은 하지 않음).
# 두 서비스가 반드시 같은 secret/issuer를 공유해야 함.
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-characters}
    issuer: ${JWT_ISSUER:gyubot-auth-service}
  internal:
    # auth-service의 내부 API 호출용 공유 시크릿 (auth-service와 동일한 값이어야 함)
    token: ${INTERNAL_API_TOKEN:change-this-internal-token}
  upload:
    # 가입 신청 첨부파일(명함·재직증명서) 저장 경로. document-service가 생기기 전까지는 로컬 디스크에 둔다.
    dir: ${UPLOAD_DIR:/tmp/gyubot-uploads}
