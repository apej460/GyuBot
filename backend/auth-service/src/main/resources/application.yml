spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/gyubot_auth}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  sql:
    init:
      mode: always

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-characters}
    issuer: ${JWT_ISSUER:gyubot-auth-service}
    access-token-ttl: 1h
    refresh-token-ttl: 14d
  otp:
    ttl: 5m
