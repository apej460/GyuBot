spring:
  application:
    name: document-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/gyubot_document}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  sql:
    init:
      mode: always

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# auth-service가 발급한 JWT를 검증만 하기 위한 값 (토큰 발급은 하지 않음).
# 두 서비스가 반드시 같은 secret/issuer를 공유해야 함.
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-characters}
    issuer: ${JWT_ISSUER:gyubot-auth-service}
  kafka:
    document-uploaded-topic: ${DOCUMENT_UPLOADED_TOPIC:document.uploaded}
    document-deleted-topic: ${DOCUMENT_DELETED_TOPIC:document.deleted}
  s3:
    bucket: ${S3_BUCKET:gyubot-documents}
    region: ${AWS_REGION:ap-northeast-2}
    # 로컬 개발은 MinIO(S3 호환)를 씀. 실제 AWS로 옮길 땐 endpoint를 비우고
    # path-style-access도 false로 바꾸면 됨 (AWS는 버킷별 서브도메인 방식을 씀).
    endpoint: ${S3_ENDPOINT:http://localhost:9100}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
